name = "pmf_loom_demo"
version = "0.1.0"
defaultTargets = ["PmfLoomDemo"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "master"

[[require]]
name = "loom2"
path = ".."

[[lean_lib]]
name = "PmfLoomDemo"
moreLeanArgs = ["-Dwarn.sorry=false", "--tstack=100000000"]
